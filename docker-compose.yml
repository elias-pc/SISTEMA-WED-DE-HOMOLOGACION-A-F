services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: af_homologacion
      POSTGRES_USER: af_user
      POSTGRES_PASSWORD: af_password
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U af_user -d af_homologacion"]
      interval: 5s
      timeout: 3s
      retries: 10
